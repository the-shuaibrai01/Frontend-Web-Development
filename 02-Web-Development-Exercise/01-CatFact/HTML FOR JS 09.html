<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Facts Generator</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f5f5f5;
        }

        .container{
            width:500px;
            background:white;
            padding:30px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            margin-bottom:20px;
        }

        #fact{
            font-size:18px;
            margin:20px 0;
            color:#333;
            min-height:70px;
        }

        #btn{
            padding:12px 25px;
            border:none;
            border-radius:5px;
            background:#007bff;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        #btn:hover{
            background:#0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🐱 Cat Facts Generator</h1>

    <p id="fact">
        Click the button to get a random cat fact.
    </p>

    <button id="btn">Get Fact</button>
</div>

<script src="class 09 js revision.js"></script>

</body>
</html>

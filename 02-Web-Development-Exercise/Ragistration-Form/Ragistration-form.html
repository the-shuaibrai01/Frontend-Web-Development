
<!DOCTYPE html>
<html>
<head>
    <title>Shuaibrai Registration Form</title>
    <link rel="stylesheet" href="Ragistration-form.css">
</head>

<body>

    <div class="container">
        <h2>Shuaibrai Registration Form</h2>

        <form onsubmit="return validateForm()">

            <label>Name:</label>
            <input type="text" id="name">

            <label>College:</label>
            <input type="text" id="college">

            <label>Email ID:</label>
            <input type="email" id="email">

            <label>Phone Number:</label>
            <input type="text" id="phone">

            <label>Sex:</label>
            <div class="gender-container">
                <input type="radio" id="male" name="gender"> Male
                <input type="radio" id="female" name="gender"> Female
            </div>

            <label>Date of Birth:</label>
            <div class="dob-row">
                <select id="day">
                    <option>Day</option>
                    <script>
                        for (var i = 1; i <= 31; i++) {
                            document.write("<option>" + i + "</option>");
                        }
                    </script>
                </select>

                <select id="month">
                    <option>Month</option>
                    <option>January</option>
                    <option>February</option>
                    <option>March</option>
                    <option>April</option>
                    <option>May</option>
                    <option>June</option>
                    <option>July</option>
                    <option>August</option>
                    <option>September</option>
                    <option>October</option>
                    <option>November</option>
                    <option>December</option>
                </select>

                <select id="year">
                    <option>Year</option>
                    <script>
                        for (var y = 1980; y <= 2025; y++) {
                            document.write("<option>" + y + "</option>");
                        }
                    </script>
                </select>
            </div>

            <label>Languages Known:</label>
            <div class="lang-container">
                <input type="checkbox" id="eng"> English
                <input type="checkbox" id="tel"> Telugu
                <input type="checkbox" id="hin"> Hindi
                <input type="checkbox" id="tam"> Tamil
            </div>

            <label>Address:</label>
            <textarea id="address"></textarea>

            <button type="submit" class="button">Register</button>
        </form>
    </div>

    <script src="Ragistration-form.js"></script>
</body>
</html>
